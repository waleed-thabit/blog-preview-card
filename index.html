<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main>
      <article class="card-container">
        <img
          class="img-1"
          src="./assets/images/illustration-article.svg"
          alt=""
        />
        <span class="learning">Learning</span>
        <p class="date">
          Published <time datetime="2023-12-21">21 Dec 2023</time>
        </p>
        <a href="#" class="title">HTML & CSS foundations</a>
        <p class="paragraph">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <footer class="card-footer">
          <img
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper image"
            class="img-2"
          />
          <p class="name">Greg Hooper</p>
        </footer>
      </article>
    </main>

    <footer class="attr">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a class="waleed" href="https://github.com/waleed-thabit">Waleed Thabit</a
      >.
    </footer>
  </body>
</html>
